
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Advice Generator App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="advice-card">
    <h1>ADVICE #<span id="advice-id">117</span></h1>

    <p id="advice-text">
      It is easy to sit up and take notice,
      what's difficult is getting up and taking action.
    </p>

    
<div class="divider">
  <span></span>
  <svg
    class="divider-icon"
    width="24"
    height="16"
    viewBox="0 0 24 16"
    aria-hidden="true"
  >
    <rect x="0" y="0" width="9" height="16" rx="4.5" fill="#CEE3E9"/>
    <rect x="15" y="0" width="9" height="16" rx="4.5" fill="#CEE3E9"/>
  </svg>
  <span></span>
</div>

<button id="generate-btn" aria-label="Generate new advice">
  <svg
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <rect x="3" y="3" width="18" height="18" rx="4"/>
    <circle cx="8" cy="8" r="1" fill="currentColor"/>
    <circle cx="16" cy="8" r="1" fill="currentColor"/>
    <circle cx="12" cy="12" r="1" fill="currentColor"/>
    <circle cx="8" cy="16" r="1" fill="currentColor"/>
    <circle cx="16" cy="16" r="1" fill="currentColor"/>
  </svg>
</button>

</main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor
    </a>.
    Coded by <a href="#">gideononso</a>.
  </footer>
</body>
</html>
